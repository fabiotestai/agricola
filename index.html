<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">

<style>
/* Layout: sticky scoreboard of two player tabs, then one compact list of scoring rows for the selected player */
:root {
  --bg: #ECEFE7;
  --surface: #F8FAF4;
  --ink: #1D2820;
  --muted: #5B695E;
  --line: #D2D9CD;
  --field: #2F5D3A;
  --p1: #2B5D8E;
  --p2: #7A3D7E;
  --p3: #1D746C;
  --p4: #8C5E0E;
  --neg: #B03A2E;
  --pos: #2E6B3A;
  --font-display: "Alegreya SC", Georgia, "Times New Roman", serif;
  --font-body: "Alegreya Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141A16; --surface: #1D251F; --ink: #E5EBE2; --muted: #9AA79C; --line: #313C34;
    --field: #84B68E; --p1: #82AEDC; --p2: #C690C9; --p3: #6CC4B9; --p4: #E2B45E; --neg: #EC8573; --pos: #8BC797;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141A16; --surface: #1D251F; --ink: #E5EBE2; --muted: #9AA79C; --line: #313C34;
  --field: #84B68E; --p1: #82AEDC; --p2: #C690C9; --p3: #6CC4B9; --p4: #E2B45E; --neg: #EC8573; --pos: #8BC797;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.35;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg);
}
.wrap {
  max-width: 560px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 32px;
}

/* Scoreboard */
.board {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg);
  padding-block: 12px 10px;
  display: grid; gap: 8px;
}
.board h1 {
  margin: 0; font-family: var(--font-display); font-weight: 700;
  font-size: 1.15rem; letter-spacing: 0.04em; color: var(--field);
  display: flex; justify-content: space-between; align-items: baseline; gap: 8px;
}
.board h1 small { font-family: var(--font-body); font-weight: 500; font-size: 0.8rem; letter-spacing: 0; color: var(--muted); }
.tabs { display: grid; grid-template-columns: repeat(var(--n, 2), minmax(0, 1fr)); gap: 8px; }
.tabs.compact { gap: 6px; }
.tabs.compact .tab { padding: 6px 8px; }
.tabs.compact .tab .nm { font-size: 0.8rem; }
.tabs.compact .tab .tot { font-size: 1.55rem; }
.tabs.compact .tab .tot span { display: none; }
.tab .rank { font-size: 0.75rem; color: var(--muted); font-weight: 500; }
.tab {
  --pc: var(--p1);
  appearance: none; font: inherit; color: inherit; cursor: pointer; text-align: left;
  background: var(--surface); border: 2px solid var(--line); border-radius: 10px;
  padding: 8px 12px; display: grid; gap: 0; min-width: 0;
}
.tab[data-p="1"], .panel[data-p="1"] { --pc: var(--p2); }
.tab[data-p="2"], .panel[data-p="2"] { --pc: var(--p3); }
.tab[data-p="3"], .panel[data-p="3"] { --pc: var(--p4); }
.tab[aria-selected="true"] { border-color: var(--pc); box-shadow: inset 0 -4px 0 var(--pc); }
.tab:focus-visible { outline: 3px solid var(--pc); outline-offset: 2px; }
.tab .nm { font-weight: 700; color: var(--pc); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.95rem; }
.tab .tot { font-family: var(--font-display); font-weight: 700; font-size: 2rem; line-height: 1.05; font-variant-numeric: tabular-nums; }
.tab .tot span { font-family: var(--font-body); font-size: 0.8rem; font-weight: 500; color: var(--muted); margin-left: 4px; }

/* Player panel */
.panel { --pc: var(--p1); display: grid; gap: 18px; margin-top: 6px; }
.panel[data-p="1"] { --pc: var(--p2); }
.name-row { display: grid; gap: 4px; }
.seg.count { padding: 0; }
.name-row label, .name-row .lab { font-size: 0.8rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.name-row input {
  font: inherit; font-weight: 700; color: var(--pc); background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%;
}
.name-row input:focus-visible { outline: 2px solid var(--pc); outline-offset: 1px; }

section.grp { display: grid; gap: 0; }
section.grp h2 {
  margin: 0 0 4px; font-family: var(--font-display); font-weight: 500; font-size: 1.05rem;
  letter-spacing: 0.05em; color: var(--muted);
  display: flex; justify-content: space-between; align-items: baseline;
}
section.grp h2 .sub { font-family: var(--font-body); font-size: 0.85rem; font-variant-numeric: tabular-nums; letter-spacing: 0; }
.rows { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }

.row {
  display: grid; grid-template-columns: minmax(0, 1fr) auto 2.9rem;
  align-items: center; gap: 8px; padding: 9px 10px;
}
.row + .row { border-top: 1px solid var(--line); }
.lbl { min-width: 0; }
.lbl .t { font-weight: 700; }
.lbl .h { font-size: 0.8rem; color: var(--muted); }

.step { display: grid; grid-template-columns: 38px 46px 38px; height: 38px; }
.step button {
  appearance: none; font: inherit; font-size: 1.25rem; font-weight: 700; line-height: 1;
  color: var(--pc); background: transparent; border: 1px solid var(--line); cursor: pointer;
  touch-action: manipulation;
}
.step button:first-child { border-radius: 8px 0 0 8px; }
.step button:last-child { border-radius: 0 8px 8px 0; }
.step button:active { background: var(--line); }
.step button:disabled { color: var(--line); cursor: default; }
.step button:focus-visible, .step input:focus-visible { outline: 2px solid var(--pc); outline-offset: -2px; position: relative; z-index: 1; }
.step input {
  font: inherit; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums;
  color: var(--ink); background: var(--bg); width: 100%; min-width: 0;
  border: 1px solid var(--line); border-left: 0; border-right: 0; padding: 0;
  -moz-appearance: textfield;
}
.step input::-webkit-outer-spin-button, .step input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

.pts {
  justify-self: end; min-width: 2.6rem; text-align: center;
  font-weight: 700; font-variant-numeric: tabular-nums; font-size: 1rem;
  padding: 4px 6px; border-radius: 999px; color: var(--muted); background: var(--bg);
}
.pts.pos { color: var(--pos); }
.pts.neg { color: var(--neg); }

.seg { display: flex; gap: 6px; padding: 0 10px 10px; flex-wrap: wrap; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg label {
  flex: 1 1 0; text-align: center; padding: 6px 4px; border-radius: 8px; cursor: pointer;
  border: 1px solid var(--line); font-size: 0.9rem; font-weight: 500; color: var(--muted);
}
.seg input:checked + label { border-color: var(--pc); color: var(--pc); font-weight: 700; background: var(--bg); }
.seg input:focus-visible + label { outline: 2px solid var(--pc); outline-offset: 1px; }

.foot { display: grid; gap: 10px; margin-top: 4px; }
.note { font-size: 0.85rem; color: var(--muted); margin: 0; }
.reset { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn {
  appearance: none; font: inherit; font-weight: 700; cursor: pointer;
  padding: 9px 14px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink);
}
.btn.danger { color: var(--neg); border-color: var(--neg); }
.btn:focus-visible { outline: 2px solid var(--field); outline-offset: 2px; }

@media (prefers-reduced-motion: no-preference) {
  .tab, .pts { transition: border-color .15s, box-shadow .15s, color .15s; }
}

/* View switch + history */
.views { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.views button {
  appearance: none; font: inherit; font-weight: 700; cursor: pointer; padding: 7px 8px;
  border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--muted);
}
.views button[aria-pressed="true"] { color: var(--field); border-color: var(--field); background: var(--bg); box-shadow: inset 0 -3px 0 var(--field); }
.views button:focus-visible { outline: 2px solid var(--field); outline-offset: 2px; }
.btn.primary { color: var(--bg); background: var(--field); border-color: var(--field); }
.btn:disabled { opacity: .6; cursor: default; }
.saved-msg { font-size: 0.9rem; color: var(--pos); font-weight: 700; }
.warn { font-size: 0.85rem; color: var(--neg); margin: 0; }
.hist { display: grid; gap: 18px; margin-top: 6px; }
.hist h2 { margin: 0 0 4px; font-family: var(--font-display); font-weight: 500; font-size: 1.05rem; letter-spacing: 0.05em; color: var(--muted); }
.lb { width: 100%; border-collapse: collapse; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; font-variant-numeric: tabular-nums; }
.lb th, .lb td { padding: 8px 6px; text-align: right; font-size: 0.92rem; }
.lb th:first-child, .lb td:first-child { text-align: left; padding-left: 10px; }
.lb th:last-child, .lb td:last-child { padding-right: 10px; }
.lb th { font-size: 0.75rem; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; }
.lb tr + tr td { border-top: 1px solid var(--line); }
.lb td.nm { font-weight: 700; max-width: 9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lb td.w { font-weight: 700; color: var(--field); }
.games { display: grid; gap: 8px; }
.game { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; display: grid; gap: 4px; }
.game .top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.game .num { font-family: var(--font-display); font-weight: 700; color: var(--field); font-size: 1.05rem; }
.game .dt { font-size: 0.8rem; color: var(--muted); }
.game ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 2px; }
.game li { display: flex; justify-content: space-between; gap: 8px; font-variant-numeric: tabular-nums; }
.game li.win { font-weight: 700; }
.game .del { justify-self: end; appearance: none; border: 0; background: none; color: var(--muted); font: inherit; font-size: 0.8rem; cursor: pointer; padding: 2px 0; text-decoration: underline; }
.game .del.really { color: var(--neg); font-weight: 700; }
.empty { color: var(--muted); font-size: 0.95rem; margin: 0; }

.game .acts { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.game .share { appearance: none; border: 1px solid var(--line); background: var(--bg); color: var(--field); font: inherit; font-weight: 700; font-size: 0.85rem; border-radius: 8px; padding: 4px 10px; cursor: pointer; }
.backup { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.backup .msg { font-size: 0.85rem; color: var(--muted); flex-basis: 100%; }

/* No sideways scrolling */
html, body { overflow-x: hidden; overflow-x: clip; overscroll-behavior-x: none; max-width: 100%; }
body { touch-action: pan-y pinch-zoom; }
.seg { position: relative; }
.seg input { left: 0; top: 0; width: 1px; height: 1px; }
.lb { table-layout: fixed; }
.lb th:first-child, .lb td:first-child { width: 30%; }
.lb td.nm { max-width: none; }
@media (max-width: 380px) { .lb th, .lb td { padding: 8px 2px; font-size: 0.85rem; } .lb th { font-size: 0.62rem; letter-spacing: 0; } .lb th:last-child, .lb td:last-child { padding-right: 8px; } }

.game .act-l { display: flex; gap: 6px; }

.game .det { margin-top: 4px; }
.dt-t { width: 100%; border-collapse: collapse; table-layout: fixed; font-variant-numeric: tabular-nums; font-size: 0.88rem; }
.dt-t th, .dt-t td { padding: 4px 3px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dt-t th:first-child, .dt-t td:first-child { text-align: left; width: 40%; padding-left: 0; }
.dt-t th { font-size: 0.78rem; font-weight: 700; color: var(--ink); border-bottom: 1px solid var(--line); }
.dt-t td.pos { color: var(--pos); }
.dt-t td.neg { color: var(--neg); }
.dt-t td.cat { color: var(--ink); white-space: normal; line-height: 1.15; }
.dt-t tr.gh td { font-family: var(--font-display); color: var(--muted); font-size: 0.82rem; letter-spacing: 0.04em; padding-top: 8px; text-align: left; }
.dt-t tr.tot td { font-weight: 700; border-top: 1px solid var(--line); padding-top: 6px; color: var(--ink); }

.game .ttl { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; }
.game .ttl .num { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.game .ren { appearance: none; border: 0; background: none; color: var(--muted); font-size: 1rem; cursor: pointer; padding: 2px 6px; line-height: 1; }
.game .ren-in { font: inherit; font-weight: 700; color: var(--field); background: var(--bg); border: 1px solid var(--field); border-radius: 6px; padding: 4px 6px; min-width: 0; flex: 1; }
.game .ren-ok { appearance: none; font: inherit; font-weight: 700; font-size: 0.85rem; color: var(--bg); background: var(--field); border: 0; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.game .dt { white-space: nowrap; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.chips:empty { display: none; }
.chip { display: inline-flex; align-items: stretch; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); overflow: hidden; }
.chip button { appearance: none; border: 0; background: none; font: inherit; cursor: pointer; color: var(--ink); }
.chip .pick { padding: 5px 4px 5px 12px; font-weight: 700; color: var(--pc); }
.chip .rm { padding: 5px 10px 5px 6px; color: var(--muted); font-size: 0.85rem; }
.chip button:focus-visible { outline: 2px solid var(--pc); outline-offset: -2px; }
</style>

</head><body>
<div class="wrap">
  <header class="board">
    <h1>Segnapunti Agricola <small id="lead"></small></h1>
    <div class="views" role="group" aria-label="Sezione">
      <button type="button" id="vCount" aria-pressed="true">Conteggio</button>
      <button type="button" id="vHist" aria-pressed="false">Storico</button>
    </div>
    <div class="tabs" id="tabs" role="tablist" aria-label="Giocatori"></div>
  </header>

  <main class="panel" id="panel" data-p="0" role="tabpanel">
    <div class="name-row">
      <label for="gname">Nome partita</label>
      <input id="gname" type="text" maxlength="40" autocomplete="off">
    </div>
    <div class="name-row">
      <span class="lab" id="countLab">Numero di giocatori</span>
      <div class="seg count" id="count" role="radiogroup" aria-labelledby="countLab">
        <input type="radio" name="count" id="count-1" value="1"><label for="count-1">1</label>
        <input type="radio" name="count" id="count-2" value="2"><label for="count-2">2</label>
        <input type="radio" name="count" id="count-3" value="3"><label for="count-3">3</label>
        <input type="radio" name="count" id="count-4" value="4"><label for="count-4">4</label>
      </div>
    </div>
    <div class="name-row">
      <label for="pname">Nome giocatore</label>
      <input id="pname" type="text" maxlength="20" autocomplete="off">
      <p class="warn" id="dupWarn" role="alert" hidden></p>
      <div class="chips" id="chips" aria-label="Giocatori salvati"></div>
    </div>
    <div id="groups"></div>
    <div class="foot">
      <div class="reset">
        <button class="btn primary" id="saveBtn" type="button">Salva partita</button>
        <button class="btn" id="shareNow" type="button" hidden>Condividi</button>
        <span class="saved-msg" id="savedMsg"></span>
      </div>
      <div class="reset" id="resetBox">
        <button class="btn" id="resetBtn" type="button">Nuova partita</button>
      </div>
    </div>
  </main>

  <section class="hist" id="hist" hidden>
    <div>
      <h2>Classifica</h2>
      <div id="lbBox"></div>
    </div>
    <div>
      <h2>Partite</h2>
      <div class="games" id="games"></div>
    </div>
    <div>
      <h2>Backup</h2>
      <div class="backup">
        <button class="btn" id="expBtn" type="button">Esporta storico</button>
        <button class="btn" id="impBtn" type="button">Importa</button>
        <input type="file" id="impFile" accept=".json,application/json" hidden>
        <span class="msg" id="bkMsg">Salva un file con tutte le partite (mandalo su WhatsApp o Drive). Con "Importa" lo ricarichi, anche su un altro telefono.</span>
      </div>
    </div>
  </section>
</div>

<script>
const TABLE = {
  fields:   [[0,-1],[2,1],[3,2],[4,3],[5,4]],
  pastures: [[0,-1],[1,1],[2,2],[3,3],[4,4]],
  grain:    [[0,-1],[1,1],[4,2],[6,3],[8,4]],
  veg:      [[0,-1],[1,1],[2,2],[3,3],[4,4]],
  sheep:    [[0,-1],[1,1],[4,2],[6,3],[8,4]],
  boar:     [[0,-1],[1,1],[3,2],[5,3],[7,4]],
  cattle:   [[0,-1],[1,1],[2,2],[4,3],[6,4]],
};
const ROOM_PTS = { wood: 0, clay: 1, stone: 2 };
const ROOM_NAME = { wood: "Legno", clay: "Argilla", stone: "Pietra" };

const GROUPS = [
  { name: "Fattoria", items: [
    { id: "fields", t: "Campi", unit: "campi", kind: "table" },
    { id: "pastures", t: "Pascoli", unit: "pascoli", kind: "table" },
    { id: "stables", t: "Stalle recintate", h: "+1 ciascuna, max 4", kind: "lin", per: 1, min: 0, max: 4 },
    { id: "unused", t: "Caselle inutilizzate", h: "−1 ciascuna", kind: "lin", per: -1, min: 0, max: 15 },
  ]},
  { name: "Raccolto", items: [
    { id: "grain", t: "Grano", unit: "grano", kind: "table" },
    { id: "veg", t: "Ortaggi", unit: "ortaggi", kind: "table" },
  ]},
  { name: "Animali", items: [
    { id: "sheep", t: "Pecore", unit: "pecore", kind: "table" },
    { id: "boar", t: "Cinghiali", unit: "cinghiali", kind: "table" },
    { id: "cattle", t: "Bovini", unit: "bovini", kind: "table" },
  ]},
  { name: "Casa e famiglia", items: [
    { id: "rooms", t: "Stanze", kind: "rooms", min: 1, max: 15 },
    { id: "family", t: "Famiglia", h: "+3 a persona", kind: "lin", per: 3, min: 1, max: 5 },
  ]},
  { name: "Carte e altro", items: [
    { id: "cards", t: "Punti carte", h: "miglioramenti e occupazioni", kind: "lin", per: 1, min: -30, max: 99 },
    { id: "bonus", t: "Punti bonus", h: "dalle carte con bonus", kind: "lin", per: 1, min: -30, max: 99 },
    { id: "begging", t: "Carte mendicità", h: "−3 ciascuna", kind: "lin", per: -3, min: 0, max: 30 },
  ]},
];
const ITEMS = GROUPS.flatMap(g => g.items);

function freshPlayer(name) {
  return { name, room: "wood", v: { fields:0, pastures:0, stables:0, unused:13, grain:0, veg:0, sheep:0, boar:0, cattle:0, rooms:2, family:2, cards:0, bonus:0, begging:0 } };
}
const MAXP = 4;
function freshState(n) { return { active: 0, n: n || 2, players: Array.from({ length: MAXP }, (_, i) => freshPlayer("Giocatore " + (i + 1))) }; }

let state;
try { state = JSON.parse(localStorage.getItem("agricola-score")); } catch (e) { state = null; }
if (!state || !Array.isArray(state.players) || !state.players.length) state = freshState();
while (state.players.length < MAXP) state.players.push(freshPlayer("Giocatore " + (state.players.length + 1)));
state.n = Math.min(MAXP, Math.max(1, state.n || 2));
if (state.active >= state.n) state.active = 0;
function save() { try { localStorage.setItem("agricola-score", JSON.stringify(state)); } catch (e) {} }

function tableScore(id, n) { let s = -1; for (const [t, p] of TABLE[id]) if (n >= t) s = p; return s; }
function nextHint(item, n) {
  const tbl = TABLE[item.id]; const cur = tableScore(item.id, n);
  const nx = tbl.find(([t, p]) => p > cur && t > n);
  if (!nx) return "massimo raggiunto";
  return `prossimo punto con ${nx[0]} ${item.unit}`;
}
function itemScore(item, p) {
  const n = p.v[item.id];
  if (item.kind === "table") return tableScore(item.id, n);
  if (item.kind === "rooms") return n * ROOM_PTS[p.room];
  return n * item.per;
}
function total(p) { return ITEMS.reduce((s, it) => s + itemScore(it, p), 0); }
function bounds(item) {
  if (item.kind === "table") return [0, 99];
  return [item.min, item.max];
}
function fmt(n) { return n > 0 ? "+" + n : n < 0 ? "−" + Math.abs(n) : "0"; }

/* Build rows once */
const groupsEl = document.getElementById("groups");
const refs = {}; const groupSubs = [];
GROUPS.forEach((g, gi) => {
  const sec = document.createElement("section"); sec.className = "grp";
  const h = document.createElement("h2"); h.innerHTML = `<span>${g.name}</span><span class="sub"></span>`;
  groupSubs[gi] = h.querySelector(".sub");
  const rows = document.createElement("div"); rows.className = "rows";
  g.items.forEach(item => {
    const row = document.createElement("div"); row.className = "row";
    const [lo, hi] = bounds(item);
    row.innerHTML = `
      <div class="lbl"><div class="t">${item.t}</div><div class="h"></div></div>
      <div class="step">
        <button type="button" aria-label="${item.t}: meno">−</button>
        <input id="in-${item.id}" type="number" inputmode="numeric" min="${lo}" max="${hi}" aria-label="${item.t}">
        <button type="button" aria-label="${item.t}: più">+</button>
      </div>
      <div class="pts" aria-live="polite"></div>`;
    const [minus, plus] = row.querySelectorAll("button");
    const input = row.querySelector("input");
    minus.addEventListener("click", () => setVal(item, cur().v[item.id] - 1));
    plus.addEventListener("click", () => setVal(item, cur().v[item.id] + 1));
    input.addEventListener("change", () => setVal(item, parseInt(input.value, 10)));
    input.addEventListener("focus", () => input.select());
    rows.appendChild(row);
    let seg = null;
    if (item.kind === "rooms") {
      seg = document.createElement("div"); seg.className = "seg"; seg.setAttribute("role", "radiogroup"); seg.setAttribute("aria-label", "Materiale della casa");
      for (const k of ["wood", "clay", "stone"]) {
        const pts = ROOM_PTS[k];
        seg.insertAdjacentHTML("beforeend", `<input type="radio" name="room" id="room-${k}" value="${k}"><label for="room-${k}">${ROOM_NAME[k]} · ${pts ? "+" + pts : "0"}</label>`);
      }
      seg.addEventListener("change", e => { cur().room = e.target.value; update(); });
      rows.appendChild(seg);
    }
    refs[item.id] = { item, input, minus, plus, pts: row.querySelector(".pts"), hint: row.querySelector(".h"), seg };
  });
  sec.append(h, rows); groupsEl.appendChild(sec);
});

function cur() { return state.players[state.active]; }
function setVal(item, n) {
  const [lo, hi] = bounds(item);
  if (Number.isNaN(n)) n = cur().v[item.id];
  cur().v[item.id] = Math.max(lo, Math.min(hi, n));
  update();
}

function update() {
  const p = cur();
  ITEMS.forEach(item => {
    const r = refs[item.id]; const n = p.v[item.id]; const [lo, hi] = bounds(item);
    if (document.activeElement !== r.input || String(r.input.value) !== String(n)) r.input.value = n;
    r.minus.disabled = n <= lo; r.plus.disabled = n >= hi;
    const s = itemScore(item, p);
    r.pts.textContent = fmt(s);
    r.pts.className = "pts" + (s > 0 ? " pos" : s < 0 ? " neg" : "");
    if (item.kind === "table") r.hint.textContent = nextHint(item, n);
    else if (item.kind === "rooms") r.hint.textContent = `di ${ROOM_NAME[p.room].toLowerCase()}: ${ROOM_PTS[p.room] ? "+" + ROOM_PTS[p.room] + " ciascuna" : "0 punti"}`;
    else r.hint.textContent = item.h;
    if (r.seg) r.seg.querySelector(`#room-${p.room}`).checked = true;
  });
  GROUPS.forEach((g, gi) => {
    const s = g.items.reduce((a, it) => a + itemScore(it, p), 0);
    groupSubs[gi].textContent = fmt(s);
  });
  const nameIn = document.getElementById("pname");
  if (document.activeElement !== nameIn) nameIn.value = p.name;
  const panel = document.getElementById("panel"); panel.dataset.p = state.active;
  const live = state.players.slice(0, state.n);
  const totals = live.map(total);
  const tabsEl = document.getElementById("tabs");
  if (tabsEl.children.length !== state.n) {
    tabsEl.innerHTML = live.map((_, i) =>
      `<button class="tab" role="tab" type="button" data-p="${i}" id="tab${i}"><span class="nm"></span><span class="tot"></span></button>`).join("");
    tabsEl.querySelectorAll(".tab").forEach(tab => tab.addEventListener("click", () => {
      state.active = Number(tab.dataset.p); update();
    }));
  }
  tabsEl.style.setProperty("--n", state.n);
  tabsEl.classList.toggle("compact", state.n >= 3);
  live.forEach((pl, i) => {
    const tab = document.getElementById("tab" + i);
    tab.setAttribute("aria-selected", String(i === state.active));
    tab.querySelector(".nm").textContent = pl.name || `Giocatore ${i + 1}`;
    tab.querySelector(".tot").innerHTML = `${totals[i]}<span>punti</span>`;
  });
  document.getElementById("count-" + state.n).checked = true;
  const lead = document.getElementById("lead");
  if (state.n === 1) {
    lead.textContent = "";
  } else {
    const order = totals.map((t, i) => [t, i]).sort((a, b) => b[0] - a[0]);
    const d = order[0][0] - order[1][0];
    lead.textContent = d === 0 ? "parità in testa"
      : `${live[order[0][1]].name || "?"} avanti di ${d}`;
  }
  save();
  if (typeof refreshSave === "function") refreshSave();
  if (typeof renderChips === "function") renderChips();
}

document.getElementById("count").addEventListener("change", e => {
  state.n = Number(e.target.value);
  if (state.active >= state.n) state.active = 0;
  update();
});
const pnameIn = document.getElementById("pname"), dupWarn = document.getElementById("dupWarn");
function effName(p, i) { return ((p.name || "").trim() || `Giocatore ${i + 1}`).toLowerCase(); }
function dupOf(value) {
  const mine = (value.trim() || `Giocatore ${state.active + 1}`).toLowerCase();
  const i = state.players.slice(0, state.n).findIndex((p, j) => j !== state.active && effName(p, j) === mine);
  return i < 0 ? null : (state.players[i].name || "").trim() || `Giocatore ${i + 1}`;
}
pnameIn.addEventListener("input", e => {
  const d = dupOf(e.target.value);
  if (d) { dupWarn.textContent = `"${d}" è già un altro giocatore di questa partita.`; dupWarn.hidden = false; pnameIn.setAttribute("aria-invalid", "true"); return; }
  dupWarn.hidden = true; pnameIn.removeAttribute("aria-invalid");
  cur().name = e.target.value; update();
});
pnameIn.addEventListener("blur", () => { dupWarn.hidden = true; pnameIn.removeAttribute("aria-invalid"); pnameIn.value = cur().name; });

const resetBox = document.getElementById("resetBox");
function showReset() {
  resetBox.innerHTML = `<button class="btn" id="resetBtn" type="button">Nuova partita</button>`;
  document.getElementById("resetBtn").addEventListener("click", askReset);
}
function askReset() {
  resetBox.innerHTML = `<span>Azzerare i punti di tutti? I nomi restano.</span>
    <button class="btn danger" id="yes" type="button">Azzera</button>
    <button class="btn" id="no" type="button">Annulla</button>`;
  document.getElementById("yes").addEventListener("click", () => {
    const names = state.players.map(p => p.name);
    state = freshState(state.n); state.players.forEach((p, i) => p.name = names[i] || p.name);
    showReset(); update();
  });
  document.getElementById("no").addEventListener("click", showReset);
}
document.getElementById("resetBtn").addEventListener("click", askReset);

/* ---------- Storico partite ---------- */
let hist;
try { hist = JSON.parse(localStorage.getItem("agricola-history")); } catch (e) { hist = null; }
if (!hist || !Array.isArray(hist.games)) hist = { next: 1, games: [] };
function saveHist() { try { localStorage.setItem("agricola-history", JSON.stringify(hist)); } catch (e) {} }
function esc(t) { return String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function snapshot() {
  return state.players.slice(0, state.n).map((p, i) => {
    const pts = {}; ITEMS.forEach(it => { pts[it.id] = itemScore(it, p); });
    return { name: (p.name || "").trim() || `Giocatore ${i + 1}`, score: total(p), pts };
  });
}
function sig(players) { return JSON.stringify(players); }
function findGame(id) { return hist.games.find(g => g.id === id); }
function nextNum() { return hist.games.length ? Math.max(...hist.games.map(g => g.num)) + 1 : 1; }
function titleOf(g) { return g.title || `Partita #${g.num}`; }
function curTitle() { return (state.gname || "").trim(); }

const saveBtn = document.getElementById("saveBtn");
const savedMsg = document.getElementById("savedMsg");
const shareNow = document.getElementById("shareNow");
function refreshSave() {
  shareNow.hidden = true;
  const gIn = document.getElementById("gname");
  if (document.activeElement !== gIn) gIn.value = state.gname || "";
  const sg = state.savedId != null ? findGame(state.savedId) : null;
  gIn.placeholder = `Partita #${sg ? sg.num : nextNum()}`;
  const live = snapshot();
  const g = state.savedId != null ? findGame(state.savedId) : null;
  if (!g) {
    state.savedId = null;
    saveBtn.textContent = `Salva partita #${nextNum()}`; saveBtn.disabled = false; savedMsg.textContent = "";
  } else if (sig(g.players) === sig(live) && (g.title || "") === curTitle()) {
    saveBtn.textContent = `Partita #${g.num} salvata ✓`; saveBtn.disabled = true; savedMsg.textContent = ""; shareNow.hidden = false; return;
  } else {
    saveBtn.textContent = `Aggiorna partita #${g.num}`; saveBtn.disabled = false; savedMsg.textContent = "";
  }
}
document.getElementById("gname").addEventListener("input", e => { state.gname = e.target.value; save(); refreshSave(); });
saveBtn.addEventListener("click", () => {
  const live = snapshot();
  const g = state.savedId != null ? findGame(state.savedId) : null;
  const title = curTitle();
  if (g) { g.players = live; g.date = new Date().toISOString(); if (title) g.title = title; else delete g.title; }
  else {
    const id = Date.now();
    const ng = { id, num: nextNum(), date: new Date().toISOString(), players: live };
    if (title) ng.title = title;
    hist.games.push(ng); hist.next = nextNum(); state.savedId = id;
  }
  live.forEach(p => addSaved(p.name)); savePlayers();
  saveHist(); save(); refreshSave(); renderHist(); renderChips();
});

function winnersOf(g) {
  const best = Math.max(...g.players.map(p => p.score));
  return g.players.length > 1 ? g.players.filter(p => p.score === best).map(p => p.name) : [];
}
function keyOf(n) { return n.trim().toLowerCase(); }

function renderHist() {
  const lbBox = document.getElementById("lbBox");
  const gamesEl = document.getElementById("games");
  if (!hist.games.length) {
    lbBox.innerHTML = `<p class="empty">Ancora nessuna partita salvata. A fine conteggio premi "Salva partita".</p>`;
    gamesEl.innerHTML = "";
    return;
  }
  const stats = new Map();
  [...hist.games].sort((a, b) => a.num - b.num).forEach(g => {
    const wins = winnersOf(g).map(keyOf);
    g.players.forEach(p => {
      const k = keyOf(p.name);
      const s = stats.get(k) || { name: p.name, games: 0, wins: 0, sum: 0, best: -Infinity };
      s.name = p.name; s.games += 1; s.sum += p.score; s.best = Math.max(s.best, p.score);
      if (wins.includes(k)) s.wins += 1;
      stats.set(k, s);
    });
  });
  const rows = [...stats.values()].sort((a, b) => b.wins - a.wins || (b.sum / b.games) - (a.sum / a.games));
  lbBox.innerHTML = `<table class="lb"><thead><tr><th>Giocatore</th><th>Partite</th><th>Vinte</th><th>Media</th><th>Record</th></tr></thead><tbody>${
    rows.map(r => `<tr><td class="nm">${esc(r.name)}</td><td>${r.games}</td><td class="w">${r.wins}</td><td>${(r.sum / r.games).toFixed(1).replace(".", ",")}</td><td>${r.best}</td></tr>`).join("")
  }</tbody></table>`;

  gamesEl.innerHTML = [...hist.games].sort((a, b) => b.num - a.num).map(g => {
    const wins = winnersOf(g);
    const hasDet = g.players.every(p => p.pts);
    const d = new Date(g.date).toLocaleDateString("it-IT", { day: "numeric", month: "short", year: "numeric" });
    const list = [...g.players].sort((a, b) => b.score - a.score)
      .map(p => `<li class="${wins.includes(p.name) ? "win" : ""}"><span>${wins.includes(p.name) ? "🏆 " : ""}${esc(p.name)}</span><span>${p.score}</span></li>`).join("");
    return `<div class="game" data-id="${g.id}"><div class="top"><span class="ttl"><span class="num">${esc(titleOf(g))}</span><button type="button" class="ren" aria-label="Rinomina partita">✎</button></span><span class="dt">${g.title ? `#${g.num} · ` : ""}${d}</span></div><ol>${list}</ol>${hasDet ? `<div class="det" hidden>${detTable(g)}</div>` : ""}<div class="acts"><span class="act-l">${hasDet ? `<button type="button" class="share dbtn" aria-expanded="false">Dettaglio</button>` : ""}<button type="button" class="share">Condividi</button></span><button type="button" class="del">Elimina</button></div></div>`;
  }).join("");
  gamesEl.querySelectorAll(".share").forEach(btn => btn.addEventListener("click", () => {
    if (btn.classList.contains("dbtn")) {
      const det = btn.closest(".game").querySelector(".det"); det.hidden = !det.hidden;
      btn.setAttribute("aria-expanded", String(!det.hidden)); btn.textContent = det.hidden ? "Dettaglio" : "Chiudi";
      return;
    }
    const g = findGame(Number(btn.closest(".game").dataset.id)); if (!g) return;
    shareCsv(g);
  }));
  gamesEl.querySelectorAll(".ren").forEach(btn => btn.addEventListener("click", () => {
    const card = btn.closest(".game"); const g = findGame(Number(card.dataset.id)); if (!g) return;
    const ttl = card.querySelector(".ttl");
    ttl.innerHTML = `<input class="ren-in" type="text" maxlength="40" placeholder="Partita #${g.num}" aria-label="Nome partita"><button type="button" class="ren-ok">OK</button>`;
    const inp = ttl.querySelector("input"); inp.value = g.title || ""; inp.focus();
    let done = false;
    const commit = () => {
      if (done) return; done = true;
      const t = inp.value.trim();
      if (t) g.title = t; else delete g.title;
      if (state.savedId === g.id) { state.gname = g.title || ""; save(); }
      saveHist(); refreshSave(); renderHist();
    };
    inp.addEventListener("keydown", e => { if (e.key === "Enter") commit(); if (e.key === "Escape") { done = true; renderHist(); } });
    inp.addEventListener("blur", () => setTimeout(commit, 150));
    ttl.querySelector(".ren-ok").addEventListener("click", commit);
  }));
  gamesEl.querySelectorAll(".del").forEach(btn => btn.addEventListener("click", () => {
    if (!btn.classList.contains("really")) { btn.classList.add("really"); btn.textContent = "Tocca di nuovo per eliminare"; return; }
    const id = Number(btn.closest(".game").dataset.id);
    hist.games = hist.games.filter(g => g.id !== id);
    if (state.savedId === id) state.savedId = null;
    saveHist(); save(); refreshSave(); renderHist();
  }));
}

const vCount = document.getElementById("vCount"), vHist = document.getElementById("vHist");
function showView(h) {
  vCount.setAttribute("aria-pressed", String(!h)); vHist.setAttribute("aria-pressed", String(h));
  document.getElementById("panel").hidden = h;
  document.getElementById("tabs").hidden = h;
  document.getElementById("lead").hidden = h;
  document.getElementById("hist").hidden = !h;
  if (h) renderHist();
  window.scrollTo(0, 0);
}
vCount.addEventListener("click", () => showView(false));
vHist.addEventListener("click", () => showView(true));

/* ---------- Condividi ---------- */
shareNow.addEventListener("click", () => { const g = findGame(state.savedId); if (g) shareCsv(g); });

/* ---------- Giocatori salvati ---------- */
let saved, hadList = false;
try { hadList = localStorage.getItem("agricola-players") !== null; saved = JSON.parse(localStorage.getItem("agricola-players")); } catch (e) { saved = null; }
if (!Array.isArray(saved)) saved = [];
function savePlayers() { try { localStorage.setItem("agricola-players", JSON.stringify(saved)); } catch (e) {} }
function isDefaultName(n) { return !n || /^Giocatore \d$/.test(n.trim()); }
function addSaved(n) {
  n = (n || "").trim(); if (isDefaultName(n)) return false;
  if (saved.some(x => keyOf(x) === keyOf(n))) return false;
  saved.push(n); saved.sort((a, b) => a.localeCompare(b, "it")); return true;
}
if (!hadList) { hist.games.forEach(g => g.players.forEach(p => addSaved(p.name))); savePlayers(); }

function renderChips() {
  const box = document.getElementById("chips"); if (!box) return;
  const used = state.players.slice(0, state.n).map((p, i) => i === state.active ? null : keyOf(p.name || "")).filter(Boolean);
  const mine = keyOf(cur().name || "");
  const list = saved.filter(n => !used.includes(keyOf(n)) && keyOf(n) !== mine);
  const sig2 = list.join("|") + "#" + state.active;
  if (box.dataset.sig === sig2) return; box.dataset.sig = sig2;
  box.innerHTML = list.map((n, i) => `<span class="chip"><button type="button" class="pick" data-i="${i}">${esc(n)}</button><button type="button" class="rm" data-i="${i}" aria-label="Rimuovi ${esc(n)} dalla lista">✕</button></span>`).join("");
  box.querySelectorAll(".pick").forEach(b => b.addEventListener("click", () => { cur().name = list[Number(b.dataset.i)]; box.dataset.sig = ""; update(); }));
  box.querySelectorAll(".rm").forEach(b => b.addEventListener("click", () => {
    const n = list[Number(b.dataset.i)];
    saved = saved.filter(x => keyOf(x) !== keyOf(n)); savePlayers(); box.dataset.sig = ""; renderChips();
  }));
}

/* ---------- Tabella dettaglio partita ---------- */
function detTable(g) {
  const ps = g.players;
  const cell = v => `<td class="${v > 0 ? "pos" : v < 0 ? "neg" : ""}">${v > 0 ? "+" + v : v < 0 ? "−" + Math.abs(v) : "0"}</td>`;
  let body = "";
  GROUPS.forEach(gr => {
    body += `<tr class="gh"><td colspan="${ps.length + 1}">${esc(gr.name)}</td></tr>`;
    gr.items.forEach(it => { body += `<tr><td class="cat">${esc(it.t)}</td>${ps.map(p => cell(p.pts[it.id])).join("")}</tr>`; });
  });
  body += `<tr class="tot"><td class="cat">Totale</td>${ps.map(p => `<td>${p.score}</td>`).join("")}</tr>`;
  return `<table class="dt-t"><thead><tr><th></th>${ps.map(p => `<th>${esc(p.name)}</th>`).join("")}</tr></thead><tbody>${body}</tbody></table>`;
}

/* ---------- CSV con i punti per categoria ---------- */
function gameCsv(g) {
  const q = v => { v = String(v); return /[;"\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
  const d = new Date(g.date).toLocaleDateString("it-IT", { day: "numeric", month: "short", year: "numeric" });
  const rows = [[titleOf(g), g.title ? `#${g.num} · ${d}` : d], [], ["Gruppo", "Categoria", ...g.players.map(p => p.name)]];
  if (g.players.every(p => p.pts))
    GROUPS.forEach(gr => gr.items.forEach(it => rows.push([gr.name, it.t, ...g.players.map(p => p.pts[it.id])])));
  rows.push(["", "TOTALE", ...g.players.map(p => p.score)]);
  return "﻿" + rows.map(r => r.map(q).join(";")).join("\r\n") + "\r\n";
}
async function shareCsv(g) {
  const name = `agricola-partita-${g.num}.csv`;
  const blob = new Blob([gameCsv(g)], { type: "text/csv" });
  const file = new File([blob], name, { type: "text/csv" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: `Agricola – ${titleOf(g)}` }); return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

/* ---------- Esporta / Importa ---------- */
const nP = n => n === 1 ? "1 partita" : `${n} partite`;
const bkMsg = document.getElementById("bkMsg");
document.getElementById("expBtn").addEventListener("click", async () => {
  if (!hist.games.length) { bkMsg.textContent = "Non ci sono ancora partite da esportare."; return; }
  const d = new Date(); const pad = n => String(n).padStart(2, "0");
  const name = `agricola-storico-${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}.json`;
  const blob = new Blob([JSON.stringify({ app: "segnapunti-agricola", version: 1, ...hist }, null, 1)], { type: "application/json" });
  const file = new File([blob], name, { type: "application/json" });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: "Storico Agricola" }); bkMsg.textContent = `Esportate ${nP(hist.games.length)}.`; return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  bkMsg.textContent = `File "${name}" salvato nei Download (${nP(hist.games.length)}).`;
});
const impFile = document.getElementById("impFile");
document.getElementById("impBtn").addEventListener("click", () => impFile.click());
impFile.addEventListener("change", async () => {
  const f = impFile.files[0]; impFile.value = ""; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data || !Array.isArray(data.games)) throw new Error("formato");
    const have = new Set(hist.games.map(g => g.id)); let added = 0;
    data.games.forEach(g => {
      if (!g || typeof g.num !== "number" || !Array.isArray(g.players) || have.has(g.id)) return;
      hist.games.push({ id: g.id ?? Date.now() + added, num: g.num, date: g.date || new Date().toISOString(), ...(g.title ? { title: String(g.title).slice(0, 40) } : {}),
        players: g.players.map(p => { const o = { name: String(p.name || "?").slice(0, 20), score: Number(p.score) || 0 };
          if (p.pts && typeof p.pts === "object") { o.pts = {}; ITEMS.forEach(it => { o.pts[it.id] = Number(p.pts[it.id]) || 0; }); } return o; }) });
      added++;
    });
    hist.next = nextNum();
    hist.games.forEach(g => g.players.forEach(p => addSaved(p.name))); savePlayers();
    saveHist(); refreshSave(); renderHist(); renderChips();
    bkMsg.textContent = added ? (added === 1 ? "Importata 1 partita." : `Importate ${added} partite.`) : "Nessuna partita nuova: erano già tutte qui.";
  } catch (e) { bkMsg.textContent = "Questo file non sembra un backup del segnapunti."; }
});
